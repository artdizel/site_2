<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка товара</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Дополнительные стили для карточки товара */
        .product-detail {
            display: flex;
            gap: 40px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .product-images {
            flex: 1;
            max-width: 500px;
        }
        
        .product-images-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            border-radius: 8px;
            background: #f5f5f5;
        }
        
        .product-images-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease;
        }
        
        .product-image-front { opacity: 1; z-index: 3; }
        .product-image-back { opacity: 0; z-index: 2; }
        .product-image-side { opacity: 0; z-index: 1; }
        
        /* При наведении — цикл: front → back → side → front */
        .product-images-wrapper:hover .product-image-front { opacity: 0; }
        .product-images-wrapper:hover .product-image-back { opacity: 1; }
        .product-images-wrapper:hover .product-image-side { opacity: 0; }
        
        /* Если только одно изображение — показываем его всегда */
        .product-images-wrapper img:only-child {
            opacity: 1 !important;
        }
        
        .product-thumbnails {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .product-thumbnails img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border 0.3s;
        }
        
        .product-thumbnails img:hover {
            border-color: #007bff;
        }
        
        .product-thumbnails img.active {
            border-color: #ff6600;
        }
        
        .product-info {
            flex: 1;
        }
        
        .product-info h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        
        .product-price {
            font-size: 28px;
            color: #ff6600;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .product-description {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #666;
        }
        
        .product-specs {
            border-top: 1px solid #ddd;
            padding-top: 20px;
            margin-bottom: 25px;
        }
        
        .product-specs h3 {
            margin-bottom: 15px;
        }
        
        .product-specs table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .product-specs td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .product-specs td:first-child {
            font-weight: bold;
            width: 30%;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #333;
            text-decoration: none;
        }
        
        .back-link:hover {
            color: #ff6600;
        }
        
        @media screen and (max-width: 768px) {
            .product-detail {
                flex-direction: column;
            }
            .product-images {
                max-width: 100%;
            }
            .product-thumbnails img {
                width: 50px;
                height: 50px;
            }
        }
        
        .no-image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #e9ecef;
            color: #6c757d;
            font-size: 18px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-container">
        <div class="logo">
            <a href="index.html"><img src="images/logo.png" alt="Логотип"></a>
        </div>
        <div class="social-links">
            <a href="#" target="_blank">ВК</a>
            <a href="#" target="_blank">MAX</a>
            <a href="#" target="_blank">ТГ</a>
        </div>
        <div class="contact-info">
            <span>📞 +7 (123) 456-78-90</span>
            <span>✉️ info@company.ru</span>
        </div>
    </div>
</header>

<nav class="nav-menu">
    <ul class="menu-list">
        <li><a href="index.html">Главная</a></li>
        <li><a href="#">О нас</a></li>
        <li><a href="#">Услуги</a></li>
        <li><a href="#">Портфолио</a></li>
        <li><a href="#">Контакты</a></li>
    </ul>
</nav>

<main class="main-content">
    <div class="content">
        <a href="javascript:history.back()" class="back-link">← Назад</a>
        <div id="product-container">
            <!-- Карточка товара будет загружена сюда -->
        </div>
    </div>
</main>

<footer class="footer">
    <div class="footer-container">
        <div class="footer-logo">
            <a href="index.html"><img src="images/logo.png" alt="Логотип"></a>
        </div>
        <div class="footer-copyright">
            &copy; 2026 Все права защищены
        </div>
        <div class="footer-contact">
            <span>📞 +7 (123) 456-78-90</span>
            <span>✉️ info@company.ru</span>
        </div>
    </div>
</footer>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const productId = parseInt(urlParams.get('id'));
    
    if (!productId) {
        window.location.href = 'index.html';
        return;
    }
    
    fetch('products.json')
        .then(response => response.json())
        .then(data => {
            const product = data.products.find(p => p.id === productId);
            
            if (!product) {
                document.getElementById('product-container').innerHTML = 
                    '<p class="error">Товар не найден</p>';
                return;
            }
            
            const category = data.categories.find(c => c.id === product.categoryId);
            
            // ===== БЕЗОПАСНАЯ РАБОТА С ИЗОБРАЖЕНИЯМИ (3 штуки) =====
            let imagesHTML = '';
            let thumbnailsHTML = '';
            let imageKeys = [];
            
            // Проверяем все три изображения
            const frontSrc = (product.image_front && product.image_front.trim() !== '') ? product.image_front : null;
            const backSrc = (product.image_back && product.image_back.trim() !== '') ? product.image_back : null;
            const sideSrc = (product.image_side && product.image_side.trim() !== '') ? product.image_side : null;
            
            // Добавляем изображения, которые есть
            if (frontSrc) {
                imagesHTML += `<img src="${frontSrc}" alt="${product.name}" class="product-image-front" data-view="front">`;
                thumbnailsHTML += `<img src="${frontSrc}" alt="Вид спереди" data-view="front" onclick="switchImage('front')">`;
                imageKeys.push('front');
            }
            
            if (backSrc) {
                imagesHTML += `<img src="${backSrc}" alt="${product.name} (вид сзади)" class="product-image-back" data-view="back">`;
                thumbnailsHTML += `<img src="${backSrc}" alt="Вид сзади" data-view="back" onclick="switchImage('back')">`;
                imageKeys.push('back');
            }
            
            if (sideSrc) {
                imagesHTML += `<img src="${sideSrc}" alt="${product.name} (вид сбоку)" class="product-image-side" data-view="side">`;
                thumbnailsHTML += `<img src="${sideSrc}" alt="Вид сбоку" data-view="side" onclick="switchImage('side')">`;
                imageKeys.push('side');
            }
            
            // Если изображений нет — заглушка
            if (!imagesHTML) {
                imagesHTML = `<div class="no-image-placeholder">Нет изображения</div>`;
            }
            
            // Сохраняем порядок изображений для переключения
            const imageOrder = imageKeys;
            
            // ===== ФОРМИРУЕМ КАРТОЧКУ =====
            let specsHTML = '';
            if (product.specs) {
                specsHTML = '<div class="product-specs"><h3>Характеристики</h3><table>';
                for (const [key, value] of Object.entries(product.specs)) {
                    specsHTML += `<tr><td>${key}</td><td>${value}</td></tr>`;
                }
                specsHTML += '</table></div>';
            }
            
            const productHTML = `
                <div class="product-detail">
                    <div class="product-images">
                        <div class="product-images-wrapper" id="image-wrapper" data-order='${JSON.stringify(imageOrder)}'>
                            ${imagesHTML}
                        </div>
                        ${thumbnailsHTML ? `<div class="product-thumbnails">${thumbnailsHTML}</div>` : ''}
                    </div>
                    <div class="product-info">
                        <h1>${product.name}</h1>
                        <div class="product-price">${product.price.toLocaleString()} ₽</div>
                        <div class="product-description">${product.description}</div>
                        ${specsHTML}
                        <a href="category.html?id=${product.categoryId}" class="back-link">← Все товары категории "${category ? category.name : ''}"</a>
                    </div>
                </div>
            `;
            
            document.getElementById('product-container').innerHTML = productHTML;
        })
        .catch(error => {
            console.error('Ошибка загрузки товара:', error);
            document.getElementById('product-container').innerHTML = 
                '<p class="error">Ошибка загрузки данных</p>';
        });
});

// Функция переключения изображений по клику на миниатюру
function switchImage(view) {
    // Находим все изображения внутри обёртки
    const wrapper = document.getElementById('image-wrapper');
    if (!wrapper) return;
    
    const images = wrapper.querySelectorAll('img');
    if (images.length === 0) return;
    
    // Скрываем все
    images.forEach(img => {
        img.style.opacity = '0';
    });
    
    // Показываем выбранное
    const targetImg = wrapper.querySelector(`img[data-view="${view}"]`);
    if (targetImg) {
        targetImg.style.opacity = '1';
    }
    
    // Подсвечиваем активную миниатюру
    document.querySelectorAll('.product-thumbnails img').forEach(thumb => {
        thumb.classList.toggle('active', thumb.dataset.view === view);
    });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка товара</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Дополнительные стили для карточки товара */
        .product-detail {
            display: flex;
            gap: 40px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .product-images {
            flex: 1;
            max-width: 500px;
        }
        
        /* Контейнер для двух изображений */
        .product-images-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            border-radius: 8px;
        }
        
        .product-images-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.6s ease;
        }
        
        /* Переднее изображение видно по умолчанию */
        .product-image-front {
            opacity: 1;
            z-index: 2;
        }
        
        /* Заднее изображение скрыто */
        .product-image-back {
            opacity: 0;
            z-index: 1;
        }
        
        /* При наведении на контейнер показываем заднее изображение */
        .product-images-wrapper:hover .product-image-front {
            opacity: 0;
        }
        
        .product-images-wrapper:hover .product-image-back {
            opacity: 1;
        }
        
        /* Если только одно изображение — показываем его всегда */
        .product-images-wrapper img:only-child {
            opacity: 1 !important;
        }
        
        /* Миниатюры для переключения (опционально) */
        .product-thumbnails {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }
        
        .product-thumbnails img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border 0.3s;
        }
        
        .product-thumbnails img:hover {
            border-color: #007bff;
        }
        
        .product-info {
            flex: 1;
        }
        
        .product-info h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        
        .product-price {
            font-size: 28px;
            color: #ff6600;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .product-description {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #666;
        }
        
        .product-specs {
            border-top: 1px solid #ddd;
            padding-top: 20px;
            margin-bottom: 25px;
        }
        
        .product-specs h3 {
            margin-bottom: 15px;
        }
        
        .product-specs table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .product-specs td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .product-specs td:first-child {
            font-weight: bold;
            width: 30%;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #333;
            text-decoration: none;
        }
        
        .back-link:hover {
            color: #ff6600;
        }
        
        /* Адаптив для мобильных */
        @media screen and (max-width: 768px) {
            .product-detail {
                flex-direction: column;
            }
            
            .product-images {
                max-width: 100%;
            }
            
            .product-thumbnails img {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-container">
        <div class="logo">
            <a href="index.html"><img src="images/logo.png" alt="Логотип"></a>
        </div>
        <div class="social-links">
            <a href="#" target="_blank">ВК</a>
            <a href="#" target="_blank">MAX</a>
            <a href="#" target="_blank">ТГ</a>
        </div>
        <div class="contact-info">
            <span>📞 +7 (123) 456-78-90</span>
            <span>✉️ info@company.ru</span>
        </div>
    </div>
</header>

<nav class="nav-menu">
    <ul class="menu-list">
        <li><a href="index.html">Главная</a></li>
        <li><a href="#">О нас</a></li>
        <li><a href="#">Услуги</a></li>
        <li><a href="#">Портфолио</a></li>
        <li><a href="#">Контакты</a></li>
    </ul>
</nav>

<main class="main-content">
    <div class="content">
        <a href="javascript:history.back()" class="back-link">← Назад</a>
        <div id="product-container">
            <!-- Карточка товара будет загружена сюда -->
        </div>
    </div>
</main>

<footer class="footer">
    <div class="footer-container">
        <div class="footer-logo">
            <a href="index.html"><img src="images/logo.png" alt="Логотип"></a>
        </div>
        <div class="footer-copyright">
            &copy; 2026 Все права защищены
        </div>
        <div class="footer-contact">
            <span>📞 +7 (123) 456-78-90</span>
            <span>✉️ info@company.ru</span>
        </div>
    </div>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id'));
        
        if (!productId) {
            window.location.href = 'index.html';
            return;
        }
        
        fetch('products.json')
            .then(response => response.json())
            .then(data => {
                const product = data.products.find(p => p.id === productId);
                
                if (!product) {
                    document.getElementById('product-container').innerHTML = 
                        '<p class="error">Товар не найден</p>';
                    return;
                }
                
                // Находим категорию товара для ссылки "назад"
                const category = data.categories.find(c => c.id === product.categoryId);
                
                // Формируем HTML для изображений
                let imagesHTML = '';
                let thumbnailsHTML = '';
                
                // Фронтальное изображение
                const frontSrc = product.image_front || product.image;
                const backSrc = product.image_back || null;
                
                if (frontSrc) {
                    imagesHTML += `<img src="${frontSrc}" alt="${product.name}" class="product-image-front" id="main-image">`;
                    thumbnailsHTML += `<img src="${frontSrc}" alt="Вид спереди" onclick="switchImage('front')">`;
                }
                
                if (backSrc) {
                    imagesHTML += `<img src="${backSrc}" alt="${product.name} (вид сзади)" class="product-image-back" id="back-image">`;
                    thumbnailsHTML += `<img src="${backSrc}" alt="Вид сзади" onclick="switchImage('back')">`;
                }
                
                // Если только одно изображение — убираем лишние стили наведения
                const hasTwoImages = frontSrc && backSrc;
                
                // Формируем HTML карточки товара
                let specsHTML = '';
                if (product.specs) {
                    specsHTML = '<div class="product-specs"><h3>Характеристики</h3><table>';
                    for (const [key, value] of Object.entries(product.specs)) {
                        specsHTML += `<tr><td>${key}</td><td>${value}</td></tr>`;
                    }
                    specsHTML += '</table></div>';
                }
                
                const productHTML = `
                    <div class="product-detail">
                        <div class="product-images">
                            <div class="product-images-wrapper" id="image-wrapper">
                                ${imagesHTML}
                            </div>
                            ${thumbnailsHTML ? `<div class="product-thumbnails">${thumbnailsHTML}</div>` : ''}
                        </div>
                        <div class="product-info">
                            <h1>${product.name}</h1>
                            <div class="product-price">${product.price.toLocaleString()} ₽</div>
                            <div class="product-description">${product.description}</div>
                            ${specsHTML}
                            <a href="category.html?id=${product.categoryId}" class="back-link">← Все товары категории "${category ? category.name : ''}"</a>
                        </div>
                    </div>
                `;
                
                document.getElementById('product-container').innerHTML = productHTML;
            })
            .catch(error => {
                console.error('Ошибка загрузки товара:', error);
                document.getElementById('product-container').innerHTML = 
                    '<p class="error">Ошибка загрузки данных</p>';
            });
    });
    
    // Функция для переключения изображений по клику на миниатюру
    function switchImage(view) {
        const frontImg = document.querySelector('.product-image-front');
        const backImg = document.querySelector('.product-image-back');
        
        if (!frontImg || !backImg) return;
        
        if (view === 'back') {
            frontImg.style.opacity = '0';
            backImg.style.opacity = '1';
        } else {
            frontImg.style.opacity = '1';
            backImg.style.opacity = '0';
        }
    }
</script>

</body>
</html>

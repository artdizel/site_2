<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товары</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="header-container">
        <div class="logo">
            <a href="index.html"><img src="images/logo.png" alt="Логотип"></a>
        </div>
        <div class="social-links">
            <a href="#" target="_blank">ВК</a>
            <a href="#" target="_blank">MAX</a>
            <a href="#" target="_blank">ТГ</a>
        </div>
        <div class="contact-info">
            <span>📞 +7 (123) 456-78-90</span>
            <span>✉️ info@company.ru</span>
        </div>
    </div>
</header>

<nav class="nav-menu">
    <ul class="menu-list">
        <li><a href="index.html">Главная</a></li>
        <li><a href="#">О нас</a></li>
        <li><a href="#">Услуги</a></li>
        <li><a href="#">Портфолио</a></li>
        <li><a href="#">Контакты</a></li>
    </ul>
</nav>

<main class="main-content">
    <section class="content">
        <a href="javascript:history.back()" class="back-link">← Назад к подкатегориям</a>
        <h1 class="page-title" id="subcategory-title">Загрузка...</h1>
        <div class="image-grid" id="products-container">
            <!-- Товары будут загружены сюда -->
        </div>
    </section>
</main>

<footer class="footer">
    <div class="footer-container">
        <div class="footer-logo">
            <a href="index.html"><img src="images/logo.png" alt="Логотип"></a>
        </div>
        <div class="footer-copyright">
            &copy; 2026 Все права защищены
        </div>
        <div class="footer-contact">
            <span>📞 +7 (123) 456-78-90</span>
            <span>✉️ info@company.ru</span>
        </div>
    </div>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const categoryId = parseInt(urlParams.get('categoryId'));
        const subcategoryId = parseInt(urlParams.get('subcategoryId'));
        
        if (!categoryId || !subcategoryId) {
            window.location.href = 'index.html';
            return;
        }
        
        fetch('products.json')
            .then(response => response.json())
            .then(data => {
                // Находим основную категорию
                const category = data.categories.find(c => c.id === categoryId);
                if (!category) {
                    window.location.href = 'index.html';
                    return;
                }
                
                // Находим подкатегорию
                const subcategory = category.subcategories.find(s => s.id === subcategoryId);
                if (!subcategory) {
                    window.location.href = 'index.html';
                    return;
                }
                
                // Устанавливаем заголовок: "Категория 1 - Худи"
                document.getElementById('subcategory-title').textContent = `${category.name} — ${subcategory.name}`;
                
                // Фильтруем товары по основной категории И подкатегории
                const filteredProducts = data.products.filter(p => 
                    p.categoryId === categoryId && p.subcategoryId === subcategoryId
                );
                
                const container = document.getElementById('products-container');
                container.innerHTML = '';
                
                if (filteredProducts.length === 0) {
                    container.innerHTML = '<p class="no-products">В этой подкатегории пока нет товаров</p>';
                    return;
                }
                
                // Создаем карточки товаров
                filteredProducts.forEach(product => {
                    const productItem = document.createElement('div');
                    productItem.className = 'image-item';
                    productItem.innerHTML = `
                        <a href="product.html?id=${product.id}">
                            <img src="${product.image}" alt="${product.name}">
                            <div class="item-overlay">
                                <h3>${product.name}</h3>
                                <p class="price">${product.price.toLocaleString()} ₽</p>
                            </div>
                        </a>
                    `;
                    container.appendChild(productItem);
                });
            })
            .catch(error => {
                console.error('Ошибка загрузки товаров:', error);
                document.getElementById('products-container').innerHTML = 
                    '<p class="error">Ошибка загрузки данных</p>';
            });
    });
</script>

<style>
    .back-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #007bff;
        text-decoration: none;
        font-size: 16px;
    }
    .back-link:hover {
        text-decoration: underline;
    }
</style>

</body>
</html>
